<!--
# 메모
원래는 resources 폴더 내의 static 폴더와 templates 폴더 내의 .html 파일을 수정할 때마다 서버를 off -> on 해줘야 한다.
그런데, 다음 코드를 build.gradle 파일에 추가함으로써 `spring-boot-devtools` 라이브러리를 추가하면,
`html` 파일을 컴파일만 해주면 서버 재시작하지 않더라도,  메뉴에서 build -> Recompile `xx.html` 을 클릭하면, View 파일 변경 사항이 반영된다.
-->
<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Hello</title>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
</head>
<body>
<p th:text="'안녕하세요. ' + ${data}" >안녕하세요. 손님</p> </body>
</html>
